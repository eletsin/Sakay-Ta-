<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sakay Ta!</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 14px;
    background: #dff7e6;
  }

  .container {
    display: flex;
    height: 100vh;
    width: 100%;
  }

  .panel {
    width: 40%;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow: hidden;
  }

  .box {
    background: #ffffff;
    border-left: 5px solid #2e7d32;
    border-radius: 8px;
    padding: 12px;
  }

  .top-box {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .logo {
    width: 250px;
    max-width: 100%;
    height: auto;
    flex-shrink: 0;
    object-fit: contain;
  }

  .search-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }

  .search-container input,
  .search-container select {
    padding: 8px;
    font-size: 14px;
    border-radius: 12px;
    border: 2px solid #2e7d32;
    width: 100%;
    outline: none;
    background: white;
  }

  .search-container input:focus,
  .search-container select:focus {
    border-color: #1b5e20;
  }

  .button-row {
    display: flex;
    gap: 8px;
  }

  .button-row button {
    flex: 1;
    padding: 8px;
    cursor: pointer;
    border-radius: 8px;
    border: none;
    background: #2e7d32;
    color: white;
    font-size: 14px;
  }

  .button-row button:hover {
    background: #1b5e20;
  }

  .button-row button:active {
    transform: scale(0.98);
  }

  #result {
    min-height: 80px;
    overflow-y: auto;
  }

  #routesList {
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
  }

  .route-item {
    background: #ffffff;
    padding: 12px;
    border-radius: 8px;
    border-left: 5px solid #c8e6c9;
    cursor: pointer;
    transition: 0.15s ease;
  }

  .route-item:hover {
    background: #f1fff5;
    border-left: 5px solid #2e7d32;
  }

  .route-item.active {
    background: #d0f0d6;
    border-left: 5px solid #54996b;
    color: #182b1e;
  }

  #map {
    width: 60%;
    height: 100vh;
  }


  @media (max-width: 1000px) {

    .panel {
      width: 45%;
      padding: 15px;
    }

    #map {
      width: 55%;
    }

    .top-box {
      gap: 12px;
    }

    .logo {
      width: 180px;
    }

  }


  @media (max-width: 768px) {

    body {
      font-size: 14px;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: auto;
      min-height: 100vh;
    }

    .panel {
      width: 100%;
      padding: 10px;
      gap: 10px;
      overflow: visible;
    }

    .top-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 15px;
    }

    .logo {
      width: 180px;
      max-width: 80%;
      height: auto;
    }

    .search-container {
      width: 100%;
      flex: none;
    }

    .search-container input,
    .search-container select {
      width: 100%;
      padding: 11px;
      font-size: 14px;
      border-radius: 10px;
    }


    .button-row {
      width: 100%;
      gap: 8px;
    }

    .button-row button {
      padding: 11px;
      font-size: 14px;
      min-height: 42px;
    }


    #result {
      min-height: 70px;
      max-height: 250px;
      overflow-y: auto;
    }


    #routesList {
      flex: none;
      max-height: 300px;
      overflow-y: auto;
    }


    #map {
      width: 100%;
      height: 50vh;
      min-height: 350px;
    }

  }



  @media (max-width: 480px) {

    .panel {
      padding: 8px;
    }

    .box {
      padding: 10px;
    }

    .top-box {
      padding: 12px;
    }

    .logo {
      width: 150px;
    }

    .search-container input,
    .search-container select {
      padding: 10px;
      font-size: 13px;
    }

    .button-row button {
      padding: 10px;
      font-size: 13px;
    }

    #map {
      height: 55vh;
      min-height: 320px;
    }
  }

</style>
</head>

<body>
<div class="container">

  <div class="panel">
    <div class="box top-box">

      <img
        src="sakay.png"
        class="logo"
        alt="Sakay Ta! Logo"
      >
  
      <div class="search-container">

        <input
          id="search-input"
          type="text"
          placeholder="Enter destination..."
        >

        <select id="vehicle-type">
          <option value="jeepney">
            🚐 Jeepney
          </option>
          <option value="modbus">
            🚌 Modernized Bus
          </option>
        </select>

        <select id="passenger-type">
          <option value="regular">
            Regular
          </option>
          <option value="student">
            Student
          </option>
          <option value="senior">
            Senior
          </option>
          <option value="pwd">
            PWD
          </option>
        </select>
        
        <div class="button-row">
          <button onclick="findRoute()">
            🔍 Find
          </button>
          <button onclick="useLocation()">
            📍 Locate
          </button>
        </div>
      </div>
    </div>

    <div class="box" id="result">

      <h2>✨ Ready</h2>

      <p>
        Search your destination
      </p>

    </div>
    <div id="routesList"></div>

  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>
  document.addEventListener("click", function(e) {

    if (e.target.closest(".route-item")) {

      const target = e.target.closest(".route-item");

      document
        .querySelectorAll(".route-item")
        .forEach(el => el.classList.remove("active"));

      target.classList.add("active");

    }

  });

</script>
<script src="app.js"></script>

</body>
</html>
