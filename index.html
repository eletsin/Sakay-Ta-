<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sakay Ta!</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 14px;
    background: #dff7e6;
  }

  .container {
    display: flex;
    height: 100vh;
  }

  .panel {
    width: 40%;
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .box {
    background: #ffffff;
    border-left: 5px solid #2e7d32;
    border-radius: 8px;
    padding: 12px;
  }

  .top-box {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .logo {
    width: 250px;
    flex-shrink: 0;
  }

  .search-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }

  /* --- UPDATED OUTLINES --- */
  .search-container input,
  .search-container select {
    padding: 8px;
    font-size: 14px;
    border-radius: 12px;
    border: 2px solid #2e7d32; /* Green Outline */
    width: 100%;
    box-sizing: border-box;
    outline: none;
  }

  .button-row {
    display: flex;
    gap: 8px;
  }

  .button-row button {
    flex: 1;
    padding: 8px;
    cursor: pointer;
    border-radius: 8px;
    border: none;
    background: #2e7d32;
    color: white;
  }

  .button-row button:hover {
    background: #1b5e20;
  }

  #result {
    min-height: 80px;
  }

  #routesList {
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    flex: 1;
  }

  .route-item {
    background: #ffffff;
    padding: 12px;
    border-radius: 8px;
    border-left: 5px solid #c8e6c9;
    cursor: pointer;
    transition: 0.15s ease;
  }

  .route-item:hover {
    background: #f1fff5;
    border-left: 5px solid sss#2e7d32;
  }

  .route-item.active {
    background: #d0f0d6;
    border-left: 5px solid #54996b;
    color: #182b1e;
  }

  #map {
    width: 60%;
    height: 100%;
  }
</style>
</head>

<body>

<div class="container">
  <div class="panel">
    <div class="box top-box">
      <img src="sakay.png" class="logo">
      <div class="search-container">
        <input id="search-input" placeholder="Enter destination...">
        <select id="vehicle-type">
          <option value="jeepney">🚐 Jeepney</option>
          <option value="modbus">🚌 Modernized Bus</option>
        </select>
        <select id="passenger-type">
          <option value="regular">Regular</option>
          <option value="student">Student</option>
          <option value="senior">Senior</option>
          <option value="pwd">PWD</option>
        </select>
        <div class="button-row">
          <button onclick="findRoute()">🔍 Find</button>
          <button onclick="useLocation()">📍 Locate</button>
        </div>
      </div>
    </div>

    <div class="box" id="result">
      <h2>✨ Ready</h2>
      <p>Search your destination</p>
    </div>

    <div id="routesList"></div>
  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  document.addEventListener("click", function(e) {
    if (e.target.closest(".route-item")) {
      const target = e.target.closest(".route-item");
      document.querySelectorAll(".route-item").forEach(el => el.classList.remove("active"));
      target.classList.add("active");
    }
  });
</script>
<script src="app.js"></script>
</body>
</html>
